name: CI/CD

on:
  push:
    branches:
      - master
      - feature/ci-cd

  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker containers
        run: docker compose build

      - name: Install Composer dependencies
        run: docker compose run --rm php composer install --no-interaction --prefer-dist

      - name: Prepare Laravel environment
        run: |
          docker compose run --rm php sh -c "
            cp .env.example .env &&
            sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env &&
            sed -i '/^DB_HOST=/d' .env &&
            sed -i '/^DB_PORT=/d' .env &&
            sed -i '/^DB_DATABASE=/d' .env &&
            sed -i '/^DB_USERNAME=/d' .env &&
            sed -i '/^DB_PASSWORD=/d' .env &&
            echo 'DB_HOST=mysql' >> .env &&
            echo 'DB_PORT=3306' >> .env &&
            echo 'DB_DATABASE=docker_lab' >> .env &&
            echo 'DB_USERNAME=docker' >> .env &&
            echo 'DB_PASSWORD=docker' >> .env &&
            php artisan key:generate
          "

      - name: Start Docker containers
        run: docker compose up -d

      - name: Wait for MySQL
        run: |
          until docker compose exec -T mysql mysqladmin ping -h localhost -uroot -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Check Docker containers
        run: docker compose ps

      - name: Check PHP version
        run: docker compose exec -T php php -v

      - name: Run Laravel migrations
        run: docker compose exec -T php php artisan migrate --force

      - name: Run Laravel tests
        run: docker compose exec -T php php artisan test

      - name: Stop Docker containers
        if: always()
        run: docker compose down

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build PHP image
        run: |
          docker build \
            -f php/Dockerfile.prod \
            -t ghcr.io/chuchocit/docker-lab:latest \
            .

      - name: Push PHP image
        run: |
          docker push ghcr.io/chuchocit/docker-lab:latest

      - name: Build Nginx image
        run: |
          docker build \
            -f nginx/Dockerfile.prod \
            -t ghcr.io/chuchocit/docker-lab-nginx:latest \
            .

      - name: Push Nginx image
        run: |
          docker push ghcr.io/chuchocit/docker-lab-nginx:latest

  deploy-qc:
    name: Deploy to Local QC
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Deploy Docker images to QC
        run: |
          cd /home/chucnguyen/projects/docker-lab-qc

          echo "==> Pull latest Docker images"
          docker compose pull

          echo "==> Restart QC containers"
          docker compose up -d

          echo "==> Run Laravel migrations"
          docker compose exec -T php php artisan migrate --force

          echo "==> Check QC status"
          docker compose ps

          echo "==> Check QC application"
          curl -I http://localhost:8090
