name: docker-lab-prod

services:

  nginx:
    image: ghcr.io/chuchocit/docker-lab-nginx:latest
    container_name: docker_lab_prod_nginx
    ports:
      - "8081:80"
    depends_on:
      - php
    restart: unless-stopped

  php:
    image: ghcr.io/chuchocit/docker-lab:latest
    container_name: docker_lab_prod_php
    depends_on:
      - mysql
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8081

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: docker_lab
      DB_USERNAME: docker
      DB_PASSWORD: docker

      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

  mysql:
    image: mysql:8.4
    container_name: docker_lab_prod_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: docker_lab
      MYSQL_USER: docker
      MYSQL_PASSWORD: docker
    ports:
      - "3308:3306"
    volumes:
      - mysql_prod_data:/var/lib/mysql

volumes:
  mysql_prod_data:
    name: docker-lab_mysql_prod_data
    external: true
